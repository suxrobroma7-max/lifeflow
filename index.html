<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LifeFlow</title>
<style>
:root{--bg:#f5f5f7;--card:#fff;--tx:#1d1d1f;--mu:#86868b;--ln:#e5e5ea;--ac:#0071e3;--ok:#30a14e;--sh:0 1px 2px rgba(0,0,0,.04),0 8px 30px rgba(0,0,0,.05);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--card:#1c1c1e;--tx:#f5f5f7;--mu:#98989d;--ln:#2c2c2e;--ac:#2997ff;--ok:#32d74b;--sh:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000;--card:#1c1c1e;--tx:#f5f5f7;--mu:#98989d;--ln:#2c2c2e;--ac:#2997ff;--ok:#32d74b;--sh:none;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{padding:28px 18px;position:sticky;top:0;align-self:start;height:100vh;display:flex;flex-direction:column;gap:6px}
.logo{font-weight:700;font-size:22px;letter-spacing:-.03em;padding:0 12px 22px}
.logo i{font-style:normal;color:var(--ac)}
.nav{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--mu);font-weight:500;text-align:left;width:100%}
.nav:hover{background:var(--ln)}
.nav.on{background:var(--card);color:var(--tx);box-shadow:var(--sh)}
.nav svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tools{margin-top:auto;display:flex;gap:8px;padding:0 6px}
.seg{display:flex;background:var(--ln);border-radius:9px;padding:2px;flex:1}
.seg button{flex:1;padding:5px 0;border-radius:7px;font-size:13px;font-weight:600;color:var(--mu)}
.seg button.on{background:var(--card);color:var(--tx);box-shadow:var(--sh)}
.theme{width:36px;border-radius:9px;background:var(--ln);font-size:16px}
main{padding:44px clamp(18px,5vw,64px) 60px;max-width:860px;width:100%}
h1{font-size:clamp(30px,5vw,44px);letter-spacing:-.035em;line-height:1.1;margin:0 0 6px;font-weight:700}
.sub{color:var(--mu);margin:0 0 28px}
.card{background:var(--card);border-radius:18px;box-shadow:var(--sh);padding:6px 20px}
.add{display:flex;gap:8px;margin-bottom:16px}
.add input{flex:1;min-width:0;background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px 14px;outline:none}
.add input:focus{border-color:var(--ac)}
.add input[type=time],.add input[type=date]{flex:0 0 auto}
.btn{background:var(--ac);color:#fff;border-radius:12px;padding:0 18px;font-weight:600}
.row{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--ln)}
.row:last-child{border:0}
.chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--ln);flex:none;display:grid;place-items:center;transition:.15s}
.chk.on{background:var(--ok);border-color:var(--ok)}
.chk.on::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.row .t{flex:1;min-width:0;overflow-wrap:anywhere}
.row.done .t{color:var(--mu);text-decoration:line-through}
.tm{color:var(--mu);font-size:14px;font-variant-numeric:tabular-nums}
.x{color:var(--mu);font-size:20px;line-height:1;padding:4px 8px;border-radius:8px}
.x:hover{color:#ff453a}
.empty{color:var(--mu);text-align:center;padding:34px 0}
.top{display:flex;align-items:center;gap:18px;justify-content:space-between}
.ring{position:relative;width:76px;height:76px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:15px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{padding:7px 14px;border-radius:99px;background:var(--card);border:1px solid var(--ln);font-size:14px;font-weight:500}
.chip.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.link{color:var(--ac);font-size:14px;font-weight:500;margin-top:14px;display:inline-block;margin-right:16px}
.mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.mh h2{margin:0;font-size:20px;letter-spacing:-.02em;text-transform:capitalize}
.mh button{width:36px;height:36px;border-radius:50%;font-size:18px;background:var(--card);box-shadow:var(--sh)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.grid .w{color:var(--mu);font-size:12px;padding:6px 0}
.d{aspect-ratio:1;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:15px;font-variant-numeric:tabular-nums;max-height:56px;margin:auto;width:100%;max-width:56px}
.d:hover{background:var(--ln)}
.d.today{color:var(--ac);font-weight:700}
.d.sel{background:var(--ac);color:#fff}
.d i{width:5px;height:5px;border-radius:50%;background:var(--ac);margin-top:2px}
.d.sel i{background:#fff}
.sec{margin:26px 0 12px;font-size:18px;font-weight:600;letter-spacing:-.02em}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.card.st{padding:14px 16px;display:flex;flex-direction:column}
.st span{color:var(--mu);font-size:13px}.st b{font-size:clamp(15px,4.4vw,20px);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.pos{color:var(--ok)}.neg{color:#ff453a}
.bar{height:6px;border-radius:3px;background:var(--ln);margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);border-radius:3px}
.add select{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px;outline:none;min-width:0}
.card.hb{padding:16px 20px;margin-bottom:12px}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px;text-align:center;font-size:12px;color:var(--mu)}
.wd{width:100%;max-width:40px;aspect-ratio:1;border-radius:50%;border:2px solid var(--ln);margin:2px auto 0;display:block;font-size:13px;color:var(--mu)}
.wd.on{background:var(--ok);border-color:var(--ok);color:#fff}
.wd.td{border-color:var(--ac)}.wd.on.td{border-color:var(--ok)}
.tabs{display:none}
@media (max-width:760px){
.app{display:block}
aside{position:static;height:auto;padding:14px 16px 0;flex-direction:row;align-items:center}
aside .nav,.logo+.navs{display:none}
.logo{padding:0;flex:1}.tools{margin:0}.seg{min-width:130px}
main{padding-top:20px;padding-bottom:100px}
.tabs{display:flex;position:fixed;left:0;right:0;bottom:0;top:auto;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--ln);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:500;color:var(--mu);padding:4px}
.tabs button.on{color:var(--ac)}
.tabs svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.add{flex-wrap:wrap}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
<aside>
<div class="logo">Life<i>Flow</i></div>
<div class="navs" id="navs"></div>
<div class="tools"><div class="seg" id="langs"></div><button class="theme" id="theme" aria-label="Theme">◐</button></div>
</aside>
<main id="main"></main>
</div>
<nav class="tabs" id="tabs"></nav>
<script>
var I={money:'<svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="3"/><circle cx="12" cy="12" r="2.5"/></svg>',habit:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M8.5 12.2l2.5 2.5 4.5-5"/></svg>',day:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/></svg>',lists:'<svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg>',cal:'<svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg>'};
var T={
uz:{loc:'uz-UZ',day:'Kunim',lists:'Roʻyxat',cal:'Taqvim',g:['Xayrli tong','Xayrli kun','Xayrli kech'],left:function(n){return n+' ta vazifa qoldi'},all:'Bugungi barcha ishlar bajarildi',noTask:'Bugun uchun vazifa yoʻq. Birinchisini qoʻshing.',task:'Yangi vazifa',add:'Qoʻshish',item:'Yangi element',list:'Yangi roʻyxat',noItem:'Roʻyxat boʻsh.',clear:'Bajarilganlarni tozalash',del:'Roʻyxatni oʻchirish',event:'Yangi tadbir',noEv:'Bu kunda tadbir yoʻq.',today:'Bugun',name:'Roʻyxat nomi',def:'Xaridlar',money:'Pulim',habit:'Odatlar',bal:'Balans',inc:'Daromad',exp:'Xarajat',amt:'Summa',note:'Izoh',noTx:'Bu oyda yozuvlar yoʻq.',newHabit:'Yangi odat',noHabit:'Birinchi odatingizni qoʻshing.',streak:function(n){return n+' kun ketma-ket'},hdone:function(a,b){return 'Bugun '+a+' / '+b+' odat bajarildi'},cats:{food:'Oziq-ovqat',tr:'Transport',home:'Uy',fun:'Dam olish',oth:'Boshqa',inc:'Daromad'}},
en:{loc:'en-US',day:'My Day',lists:'Lists',cal:'Calendar',g:['Good morning','Good afternoon','Good evening'],left:function(n){return n+(n==1?' task':' tasks')+' left'},all:'Everything for today is done',noTask:'No tasks for today. Add your first one.',task:'New task',add:'Add',item:'New item',list:'New list',noItem:'This list is empty.',clear:'Clear completed',del:'Delete list',event:'New event',noEv:'No events on this day.',today:'Today',name:'List name',def:'Groceries',money:'Money',habit:'Habits',bal:'Balance',inc:'Income',exp:'Expenses',amt:'Amount',note:'Note',noTx:'No entries this month.',newHabit:'New habit',noHabit:'Add your first habit.',streak:function(n){return n+(n==1?' day':' days')+' in a row'},hdone:function(a,b){return a+' of '+b+' habits done today'},cats:{food:'Food',tr:'Transport',home:'Home',fun:'Leisure',oth:'Other',inc:'Income'}},
ru:{loc:'ru-RU',day:'Мой день',lists:'Списки',cal:'Календарь',g:['Доброе утро','Добрый день','Добрый вечер'],left:function(n){return 'Осталось задач: '+n},all:'Все дела на сегодня выполнены',noTask:'На сегодня задач нет. Добавьте первую.',task:'Новая задача',add:'Добавить',item:'Новый пункт',list:'Новый список',noItem:'Список пуст.',clear:'Убрать выполненные',del:'Удалить список',event:'Новое событие',noEv:'В этот день событий нет.',today:'Сегодня',name:'Название списка',def:'Покупки',money:'Деньги',habit:'Привычки',bal:'Баланс',inc:'Доходы',exp:'Расходы',amt:'Сумма',note:'Заметка',noTx:'В этом месяце записей нет.',newHabit:'Новая привычка',noHabit:'Добавьте первую привычку.',streak:function(n){return 'Дней подряд: '+n},hdone:function(a,b){return 'Сегодня выполнено '+a+' из '+b},cats:{food:'Еда',tr:'Транспорт',home:'Дом',fun:'Досуг',oth:'Другое',inc:'Доход'}}};
var S={lang:'uz',theme:'auto',tab:'day',tasks:[],lists:[],ev:[],cur:null,money:[],habits:[]};
var V={ym:new Date(),sel:null};
try{var r=localStorage.getItem('lifeflow');if(r)Object.assign(S,JSON.parse(r))}catch(e){}
function save(){try{localStorage.setItem('lifeflow',JSON.stringify(S))}catch(e){}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function key(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var tk=key(new Date());V.sel=tk;
function t(){return T[S.lang]}
function ui(){
document.documentElement.lang=S.lang;
if(S.theme==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',S.theme);
var tabs=['day','lists','cal','money','habit'];
var nv=tabs.map(function(k){return '<button class="nav'+(S.tab===k?' on':'')+'" data-a="tab" data-v="'+k+'">'+I[k]+t()[k]+'</button>'}).join('');
document.getElementById('navs').innerHTML=nv;
document.getElementById('tabs').innerHTML=tabs.map(function(k){return '<button class="'+(S.tab===k?'on':'')+'" data-a="tab" data-v="'+k+'">'+I[k]+t()[k]+'</button>'}).join('');
document.getElementById('langs').innerHTML=['uz','en','ru'].map(function(l){return '<button class="'+(S.lang===l?'on':'')+'" data-a="lang" data-v="'+l+'">'+l.toUpperCase()+'</button>'}).join('');
document.getElementById('main').innerHTML=S.tab==='day'?vDay():S.tab==='lists'?vLists():S.tab==='money'?vMoney():S.tab==='habit'?vHabit():vCal();
}
function vDay(){
var L=t(),h=new Date().getHours(),g=L.g[h<12?0:h<18?1:2];
var ts=S.tasks.filter(function(x){return x.d===tk}).sort(function(a,b){return (a.tm||'99').localeCompare(b.tm||'99')});
var evs=S.ev.filter(function(e){return e.d===tk});
var dn=ts.filter(function(x){return x.done}).length,p=ts.length?dn/ts.length:0,left=ts.length-dn;
var date=new Date().toLocaleDateString(L.loc,{weekday:'long',day:'numeric',month:'long'});
var c=2*Math.PI*32;
var o='<div class="top"><div><h1>'+g+'</h1><p class="sub" style="margin:0">'+esc(date)+' · '+(ts.length&&!left?L.all:L.left(left))+'</p></div><div class="ring"><svg width="76" height="76"><circle cx="38" cy="38" r="32" fill="none" stroke="var(--ln)" stroke-width="7"/><circle cx="38" cy="38" r="32" fill="none" stroke="var(--ok)" stroke-width="7" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+c*(1-p)+'" style="transition:stroke-dashoffset .5s"/></svg><b>'+Math.round(p*100)+'%</b></div></div><div style="height:26px"></div>';
o+='<div class="add"><input id="tt" placeholder="'+L.task+'" maxlength="140"><input id="tm" type="time" aria-label="time"><button class="btn" data-a="addTask">'+L.add+'</button></div>';
o+='<div class="card">'+(ts.length?ts.map(function(x){return '<div class="row'+(x.done?' done':'')+'"><button class="chk'+(x.done?' on':'')+'" data-a="tog" data-v="'+x.id+'" aria-label="done"></button><span class="t">'+esc(x.t)+'</span>'+(x.tm?'<span class="tm">'+x.tm+'</span>':'')+'<button class="x" data-a="delTask" data-v="'+x.id+'" aria-label="delete">×</button></div>'}).join(''):'<div class="empty">'+L.noTask+'</div>')+'</div>';
if(evs.length)o+='<div class="sec">'+L.cal+'</div><div class="card">'+evs.map(function(e){return '<div class="row"><span class="t">'+esc(e.t)+'</span></div>'}).join('')+'</div>';
return o}
function curList(){var l=S.lists.find(function(x){return x.id===S.cur});if(!l&&S.lists.length){l=S.lists[0];S.cur=l.id}return l}
function vLists(){
var L=t(),l=curList();
var o='<h1>'+L.lists+'</h1><p class="sub">&nbsp;</p><div class="chips">'+S.lists.map(function(x){return '<button class="chip'+(l&&x.id===l.id?' on':'')+'" data-a="pick" data-v="'+x.id+'">'+esc(x.name)+'</button>'}).join('')+'</div>';
if(!l)return o+'<div class="add"><input id="ln" placeholder="'+L.name+'" maxlength="40"><button class="btn" data-a="addList">'+L.list+'</button></div>';
o+='<div class="add"><input id="li" placeholder="'+L.item+'" maxlength="120"><button class="btn" data-a="addItem">'+L.add+'</button></div>';
o+='<div class="card">'+(l.items.length?l.items.map(function(x){return '<div class="row'+(x.done?' done':'')+'"><button class="chk'+(x.done?' on':'')+'" data-a="togI" data-v="'+x.id+'" aria-label="done"></button><span class="t">'+esc(x.t)+'</span><button class="x" data-a="delI" data-v="'+x.id+'" aria-label="delete">×</button></div>'}).join(''):'<div class="empty">'+L.noItem+'</div>')+'</div>';
o+='<button class="link" data-a="clr">'+L.clear+'</button><button class="link" data-a="delList" style="color:#ff453a">'+L.del+'</button>';
o+='<div class="sec">'+L.list+'</div><div class="add"><input id="ln" placeholder="'+L.name+'" maxlength="40"><button class="btn" data-a="addList">'+L.add+'</button></div>';
return o}
function vCal(){
var L=t(),y=V.ym.getFullYear(),m=V.ym.getMonth(),first=new Date(y,m,1),off=(first.getDay()+6)%7,n=new Date(y,m+1,0).getDate();
var o='<h1>'+L.cal+'</h1><p class="sub">&nbsp;</p><div class="card" style="padding:18px 16px"><div class="mh"><button data-a="mo" data-v="-1" aria-label="prev">‹</button><h2>'+first.toLocaleDateString(L.loc,{month:'long',year:'numeric'})+'</h2><button data-a="mo" data-v="1" aria-label="next">›</button></div><div class="grid">';
for(var i=0;i<7;i++)o+='<div class="w">'+new Date(2024,0,1+i).toLocaleDateString(L.loc,{weekday:'short'})+'</div>';
for(i=0;i<off;i++)o+='<div></div>';
for(i=1;i<=n;i++){var k=key(new Date(y,m,i)),has=S.ev.some(function(e){return e.d===k});o+='<button class="d'+(k===tk?' today':'')+(k===V.sel?' sel':'')+'" data-a="sel" data-v="'+k+'">'+i+(has?'<i></i>':'')+'</button>'}
o+='</div></div>';
var dd=new Date(V.sel+'T00:00');
o+='<div class="sec">'+dd.toLocaleDateString(L.loc,{weekday:'long',day:'numeric',month:'long'})+'</div><div class="add"><input id="et" placeholder="'+L.event+'" maxlength="100"><button class="btn" data-a="addEv">'+L.add+'</button></div>';
var es=S.ev.filter(function(e){return e.d===V.sel});
o+='<div class="card">'+(es.length?es.map(function(e){return '<div class="row"><span class="t">'+esc(e.t)+'</span><button class="x" data-a="delEv" data-v="'+e.id+'" aria-label="delete">×</button></div>'}).join(''):'<div class="empty">'+L.noEv+'</div>')+'</div>';
return o}
function vMoney(){
var L=t(),y=V.ym.getFullYear(),m=V.ym.getMonth(),pre=y+'-'+String(m+1).padStart(2,'0');
var xs=S.money.filter(function(x){return x.d.indexOf(pre)===0}).sort(function(a,b){return b.d.localeCompare(a.d)});
var inc=0,exp=0,by={};
xs.forEach(function(x){if(x.c==='inc')inc+=x.a;else{exp+=x.a;by[x.c]=(by[x.c]||0)+x.a}});
var f=function(n){return Math.round(n).toLocaleString(L.loc)};
var o='<h1>'+L.money+'</h1><p class="sub">&nbsp;</p><div class="mh"><button data-a="mo" data-v="-1" aria-label="prev">‹</button><h2>'+new Date(y,m,1).toLocaleDateString(L.loc,{month:'long',year:'numeric'})+'</h2><button data-a="mo" data-v="1" aria-label="next">›</button></div>';
o+='<div class="stats"><div class="card st"><span>'+L.bal+'</span><b class="'+(inc-exp<0?'neg':'')+'">'+f(inc-exp)+'</b></div><div class="card st"><span>'+L.inc+'</span><b class="pos">'+f(inc)+'</b></div><div class="card st"><span>'+L.exp+'</span><b>'+f(exp)+'</b></div></div>';
var ks=Object.keys(by).sort(function(a,b){return by[b]-by[a]});
if(ks.length)o+='<div class="card" style="padding:10px 20px 14px;margin-bottom:16px">'+ks.map(function(k){return '<div style="margin:10px 0"><div style="display:flex;justify-content:space-between;font-size:14px"><span>'+L.cats[k]+'</span><span>'+f(by[k])+'</span></div><div class="bar"><i style="width:'+Math.round(by[k]/exp*100)+'%"></i></div></div>'}).join('')+'</div>';
o+='<div class="add"><input id="ma" type="number" inputmode="decimal" min="0" placeholder="'+L.amt+'"><select id="mc" aria-label="category">'+Object.keys(L.cats).map(function(k){return '<option value="'+k+'">'+L.cats[k]+'</option>'}).join('')+'</select><input id="mn" placeholder="'+L.note+'" maxlength="60"><button class="btn" data-a="addTx">'+L.add+'</button></div>';
o+='<div class="card">'+(xs.length?xs.map(function(x){var p=x.c==='inc';return '<div class="row"><span class="t">'+L.cats[x.c]+(x.t?' <span class="tm">· '+esc(x.t)+'</span>':'')+'<br><span class="tm">'+new Date(x.d+'T00:00').toLocaleDateString(L.loc,{day:'numeric',month:'short'})+'</span></span><b class="'+(p?'pos':'')+'" style="font-variant-numeric:tabular-nums">'+(p?'+':'−')+f(x.a)+'</b><button class="x" data-a="delTx" data-v="'+x.id+'" aria-label="delete">×</button></div>'}).join(''):'<div class="empty">'+L.noTx+'</div>')+'</div>';
return o}
function streak(h){var s=0,d=new Date();if(h.days.indexOf(key(d))<0)d.setDate(d.getDate()-1);while(h.days.indexOf(key(d))>=0){s++;d.setDate(d.getDate()-1)}return s}
function vHabit(){
var L=t(),dn=S.habits.filter(function(h){return h.days.indexOf(tk)>=0}).length;
var o='<h1>'+L.habit+'</h1><p class="sub">'+(S.habits.length?L.hdone(dn,S.habits.length):'&nbsp;')+'</p><div class="add"><input id="hn" placeholder="'+L.newHabit+'" maxlength="60"><button class="btn" data-a="addHabit">'+L.add+'</button></div>';
if(!S.habits.length)return o+'<div class="card"><div class="empty">'+L.noHabit+'</div></div>';
S.habits.forEach(function(h){
var st=streak(h);
o+='<div class="card hb"><div class="row" style="padding:0;border:0"><span class="t" style="font-weight:600">'+esc(h.t)+'<br><span class="tm">'+(st?'🔥 '+L.streak(st):'&nbsp;')+'</span></span><button class="x" data-a="delHabit" data-v="'+h.id+'" aria-label="delete">×</button></div><div class="wk">';
for(var i=6;i>=0;i--){var d=new Date();d.setDate(d.getDate()-i);var k=key(d),on=h.days.indexOf(k)>=0;o+='<div>'+d.toLocaleDateString(L.loc,{weekday:'narrow'})+'<button class="wd'+(on?' on':'')+(k===tk?' td':'')+'" data-a="hd" data-v="'+h.id+'|'+k+'">'+d.getDate()+'</button></div>'}
o+='</div></div>'});
return o}
function val(id){var e=document.getElementById(id);return e?e.value.trim():''}
document.addEventListener('click',function(e){
var b=e.target.closest('[data-a]');if(!b)return;
var a=b.dataset.a,v=b.dataset.v,l=curList();
if(a==='tab')S.tab=v;
else if(a==='lang')S.lang=v;
else if(a==='addTask'){var x=val('tt');if(!x)return;S.tasks.push({id:uid(),t:x,tm:val('tm'),d:tk,done:false})}
else if(a==='tog'){S.tasks.forEach(function(x){if(x.id===v)x.done=!x.done})}
else if(a==='delTask')S.tasks=S.tasks.filter(function(x){return x.id!==v});
else if(a==='pick')S.cur=v;
else if(a==='addList'){var n=val('ln');if(!n)return;var nl={id:uid(),name:n,items:[]};S.lists.push(nl);S.cur=nl.id}
else if(a==='addItem'){var q=val('li');if(!q||!l)return;l.items.push({id:uid(),t:q,done:false})}
else if(a==='togI'){l.items.forEach(function(x){if(x.id===v)x.done=!x.done})}
else if(a==='delI')l.items=l.items.filter(function(x){return x.id!==v});
else if(a==='clr'&&l)l.items=l.items.filter(function(x){return !x.done});
else if(a==='delList'&&l){S.lists=S.lists.filter(function(x){return x.id!==l.id});S.cur=null}
else if(a==='mo')V.ym=new Date(V.ym.getFullYear(),V.ym.getMonth()+ +v,1);
else if(a==='sel')V.sel=v;
else if(a==='addEv'){var z=val('et');if(!z)return;S.ev.push({id:uid(),t:z,d:V.sel})}
else if(a==='delEv')S.ev=S.ev.filter(function(x){return x.id!==v});
else if(a==='addTx'){var am=parseFloat(val('ma'));if(!(am>0))return;S.money.push({id:uid(),a:am,c:document.getElementById('mc').value,t:val('mn'),d:tk})}
else if(a==='delTx')S.money=S.money.filter(function(x){return x.id!==v});
else if(a==='addHabit'){var hn=val('hn');if(!hn)return;S.habits.push({id:uid(),t:hn,days:[]})}
else if(a==='hd'){var pp=v.split('|');S.habits.forEach(function(h){if(h.id===pp[0]){var j=h.days.indexOf(pp[1]);if(j<0)h.days.push(pp[1]);else h.days.splice(j,1)}})}
else if(a==='delHabit')S.habits=S.habits.filter(function(x){return x.id!==v});
save();ui();
if(a==='addTask'||a==='addItem'||a==='addEv'||a==='addTx'||a==='addHabit'){var f=document.querySelector('.add input');if(f)f.focus()}
});
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.matches('.add input')){var bt=e.target.parentNode.querySelector('.btn');if(bt)bt.click()}});
document.getElementById('theme').addEventListener('click',function(){S.theme=S.theme==='auto'?'dark':S.theme==='dark'?'light':'auto';save();ui()});
if(!S.lists.length){S.lists.push({id:uid(),name:T[S.lang].def,items:[]});S.cur=S.lists[0].id}
ui();
</script>
</body>
</html>
